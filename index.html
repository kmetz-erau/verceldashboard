<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Browser-based energy cost, usage, demand, and EUI dashboard." />
    <title>Energy Lens</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand"><span class="brand-mark">EL</span><div><strong>Energy Lens</strong><small>Utility intelligence, in your browser</small></div></div>
        <div class="top-actions"><label class="file-button">Quick data file<input id="quickFile" type="file" accept=".db,.duckdb,.csv,text/csv" /></label><span id="runtime" class="runtime">Ready</span></div>
      </header>
      <div id="message" class="message" aria-live="polite"></div>
      <div class="layout">
        <aside id="nav" class="sidebar"></aside>
        <main class="main"><div class="eyebrow">ENERGY PERFORMANCE WORKSPACE</div><h1 id="pageTitle">Executive Overview</h1><div id="page"></div></main>
      </div>
    </div>
    <script type="module" src="app.js"></script>
  </body>
</html>
